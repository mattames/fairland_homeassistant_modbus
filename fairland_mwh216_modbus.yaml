        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault Fb"
        unique_id: fairland_hp_di_91_fb
        device_address: 1
        address: 91
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

    # =========================================================================
    # COILS (0x) — read/write, FC01 read / FC05 write
    # =========================================================================
    # Coil 2 (Restore factory values) is deliberately absent. Do not add it.
    switches:
      - name: "Pool HP Power"
        unique_id: fairland_hp_coil_00_power
        device_address: 1
        address: 0
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 0
          delay: 2
          state_on: 1
          state_off: 0

      - name: "Pool HP Force Defrost"
        unique_id: fairland_hp_coil_01_force_defrost
        device_address: 1
        address: 1
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 1
          delay: 2
          state_on: 1
          state_off: 0

    # =========================================================================
    # SENSORS
    # =========================================================================
    sensors:
      # --- Input registers 0-14 (3x, FC04). 15-29 are Reserved on MWH216 -----
      - name: "Pool HP Compressor Speed"
        unique_id: fairland_hp_ir_00_speed_pct
        device_address: 1
        address: 0
        input_type: input
        data_type: int16
        unit_of_measurement: "%"
        state_class: measurement
        scan_interval: 15

      - name: "Pool HP Compressor Target Frequency"
        unique_id: fairland_hp_ir_01_target_freq
        device_address: 1
        address: 1
        input_type: input
        data_type: int16
        unit_of_measurement: "Hz"
        state_class: measurement
        scan_interval: 30

      - name: "Pool HP PFC Voltage"
        unique_id: fairland_hp_ir_02_pfc_voltage
        device_address: 1
        address: 2
        input_type: input
        data_type: int16
        device_class: voltage
        unit_of_measurement: "V"
        state_class: measurement
        scan_interval: 30

      # Type 1
      - name: "Pool HP Water Inlet Temperature"
        unique_id: fairland_hp_ir_03_inlet_temp
        device_address: 1
        address: 3
        input_type: input
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 10

      # Type 1
      - name: "Pool HP Water Outlet Temperature"
        unique_id: fairland_hp_ir_04_outlet_temp
        device_address: 1
        address: 4
        input_type: input
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 10

      # Type 1
      - name: "Pool HP Ambient Temperature"
        unique_id: fairland_hp_ir_05_ambient_temp
        device_address: 1
        address: 5
        input_type: input
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 60

      # TYPE 2 — no offset. Compressor discharge, runs 60-100 °C.
      - name: "Pool HP Gas Exhaust Temperature"
        unique_id: fairland_hp_ir_06_gas_exhaust_temp
        device_address: 1
        address: 6
        input_type: input
        data_type: int16
        scale: 0.5
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      # Type 1
      - name: "Pool HP Outer Coil Temperature"
        unique_id: fairland_hp_ir_07_outer_coil_temp
        device_address: 1
        address: 7
        input_type: input
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      # Type 1
      - name: "Pool HP Gas Return Temperature"
        unique_id: fairland_hp_ir_08_gas_return_temp
        device_address: 1
        address: 8
        input_type: input
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      # Type 1 — titanium heat exchanger
      - name: "Pool HP Inner Coil Temperature"
        unique_id: fairland_hp_ir_09_inner_coil_temp
        device_address: 1
        address: 9
        input_type: input
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      - name: "Pool HP Compressor Frequency"
        unique_id: fairland_hp_ir_10_run_freq
        device_address: 1
        address: 10
        input_type: input
        data_type: int16
        unit_of_measurement: "Hz"
        state_class: measurement
        scan_interval: 15

      - name: "Pool HP Compressor Current"
        unique_id: fairland_hp_ir_11_compressor_current
        device_address: 1
        address: 11
        input_type: input
        data_type: int16
        scale: 0.1
        precision: 1
        device_class: current
        unit_of_measurement: "A"
        state_class: measurement
        scan_interval: 15

      # TYPE 2 — no offset. Inverter cooling plate.
      - name: "Pool HP Cooling Plate Temperature"
        unique_id: fairland_hp_ir_12_cooling_plate_temp
        device_address: 1
        address: 12
        input_type: input
        data_type: int16
        scale: 0.5
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        scan_interval: 30

      - name: "Pool HP EEV Opening"
        unique_id: fairland_hp_ir_13_eev_opening
        device_address: 1
        address: 13
        input_type: input
        data_type: int16
        state_class: measurement
        scan_interval: 30

      - name: "Pool HP DC Fan Speed"
        unique_id: fairland_hp_ir_14_fan_speed
        device_address: 1
        address: 14
        input_type: input
        data_type: int16
        unit_of_measurement: "rpm"
        state_class: measurement
        scan_interval: 30

      # --- Holding registers (4x, FC03) surfaced read-only -------------------
      - name: "Pool HP Function Selection Raw"
        unique_id: fairland_hp_hr_00_function
        device_address: 1
        address: 0
        input_type: holding
        data_type: int16
        scan_interval: 30

      - name: "Pool HP Working Mode Raw"
        unique_id: fairland_hp_hr_01_working_mode
        device_address: 1
        address: 1
        input_type: holding
        data_type: int16
        scan_interval: 30

      - name: "Pool HP Auto Setpoint"
        unique_id: fairland_hp_hr_02_auto_setpoint
        device_address: 1
        address: 2
        input_type: holding
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        scan_interval: 30

      - name: "Pool HP Heating Setpoint"
        unique_id: fairland_hp_hr_03_heat_setpoint
        device_address: 1
        address: 3
        input_type: holding
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        scan_interval: 30

      - name: "Pool HP Cooling Setpoint"
        unique_id: fairland_hp_hr_04_cool_setpoint
        device_address: 1
        address: 4
        input_type: holding
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        scan_interval: 30

      - name: "Pool HP Water Pump Mode Raw"
        unique_id: fairland_hp_hr_05_pump_mode
        device_address: 1
        address: 5
        input_type: holding
        data_type: int16
        scan_interval: 300

      - name: "Pool HP Water Pump Run Time"
        unique_id: fairland_hp_hr_06_pump_time
        device_address: 1
        address: 6
        input_type: holding
        data_type: int16
        unit_of_measurement: "min"
        scan_interval: 300

      - name: "Pool HP Compressor Run Time Between Defrost"
        unique_id: fairland_hp_hr_07_comp_run_time
        device_address: 1
        address: 7
        input_type: holding
        data_type: int16
        unit_of_measurement: "min"
        scan_interval: 3600

      # Type 1 — NOT plain °C. Default raw 46 = -7 °C.
      - name: "Pool HP Defrost Entry Temperature"
        unique_id: fairland_hp_hr_08_defrost_entry
        device_address: 1
        address: 8
        input_type: holding
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        scan_interval: 3600

      - name: "Pool HP Max Defrost Run Time"
        unique_id: fairland_hp_hr_09_max_defrost_time
        device_address: 1
        address: 9
        input_type: holding
        data_type: int16
        unit_of_measurement: "min"
        scan_interval: 3600

      # Type 1 — default raw 86 = 13 °C.
      - name: "Pool HP Defrost Exit Temperature"
        unique_id: fairland_hp_hr_10_defrost_exit
        device_address: 1
        address: 10
        input_type: holding
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        scan_interval: 3600

      # Type 1 — default raw 66 = 3 °C.
      - name: "Pool HP EEV Superheat Heating"
        unique_id: fairland_hp_hr_17_eev_superheat_heat
        device_address: 1
        address: 17
        input_type: holding
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        scan_interval: 3600

      # Type 1 — default raw 64 = 2 °C.
      - name: "Pool HP EEV Superheat Cooling"
        unique_id: fairland_hp_hr_18_eev_superheat_cool
        device_address: 1
        address: 18
        input_type: holding
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        device_class: temperature
        unit_of_measurement: "°C"
        scan_interval: 3600

      - name: "Pool HP Power-off Restart Memory"
        unique_id: fairland_hp_hr_25_restart_memory
        device_address: 1
        address: 25
        input_type: holding
        data_type: int16
        scan_interval: 3600

    # =========================================================================
    # CLIMATE
    # =========================================================================
    climates:
      - name: "Pool Heat Pump"
        unique_id: fairland_hp_climate
        device_address: 1

        # Current temperature: input register 3, water inlet (type 1).
        address: 3
        input_type: input
        data_type: int16
        scale: 0.5
        offset: -30
        precision: 1
        temperature_unit: C

        # Raw step is 2, and 2 raw = 1.0 °C, so the board cannot accept
        # half-degree setpoints.
        temp_step: 1

        # HEATING-ONLY ENTITY — deliberate. Read this before "fixing" it.
        #
        # min_temp/max_temp are single values for the whole entity, but the
        # three setpoint registers have three different documented ranges:
        #
        #   HR 2  auto     raw  84-140  =  12-40 °C
        #   HR 3  heating  raw  96-140  =  18-40 °C
        #   HR 4  cooling  raw  84-120  =  12-30 °C
        #
        # An entity that switches target register by mode therefore cannot
        # have correct bounds in every mode. The previous version pointed
        # AUTO at HR 2 and COOL at HR 4 while advertising 18-40 °C, so
        # commanding 35 °C in cooling mode wrote raw 130 to a register the
        # document caps at 120 — an out-of-range write to a live compressor.
        #
        # This entity is now pinned to heating: every slot in
        # target_temp_register is HR 3, and 18-40 °C is exactly HR 3's
        # documented range. No reachable UI action can produce an
        # out-of-range write.
        #
        # Auto and cooling setpoints moved to the scripts at the bottom of
        # this file, which carry their own correct bounds (12-40 and 12-30).
        # Mode switching moved to pool_hp_set_function.
        min_temp: 18
        max_temp: 40
        scan_interval: 15

        # Fixed 7-entry list: AUTO, COOL, DRY, FAN_ONLY, HEAT, HEAT_COOL, OFF.
        # All seven are HR 3 so that no mode can retarget the write.
        target_temp_register: [3, 3, 3, 3, 3, 3, 3]
        target_temp_write_registers: false

        # Power is coil 0.
        hvac_onoff_coil: 0

        # HR 0 Function Selection: 0 = Auto, 1 = Heating, 2 = Cooling.
        # Only Heating is mapped, so the entity offers heat/off and cannot
        # move the board into a mode whose setpoint bounds it doesn't honour.
        # If the unit is put into Auto or Cooling by its own panel or by
        # pool_hp_set_function, HR 0 reads 0 or 2, which is outside this map
        # and the entity will report an unknown hvac mode. That is intended:
        # sensor.pool_hp_operating_mode still shows the true mode.
        hvac_mode_register:
          address: 0
          write_registers: false
          values:
            state_heat: 1

        # HR 1 Working Mode Selection on MWH216: 0 = Smart, 1 = Silence,
        # 3 = Turbo. Value 2 is NOT defined on this board — don't write it.
        # The doc qualifies Turbo with "(Some models without Turbo)", so
        # selecting it may be a no-op on this unit. Check the unit's own
        # panel follows before relying on it.
        # (The MWH366/367/381 boards use a different mapping: 0 = Silence,
        # 1 = Smart, 2 = Turbo. Don't copy configs between them.)
        fan_mode_register:
          address: 1
          values:
            state_fan_high: 0      # Smart
            state_fan_low: 1       # Silence
            state_fan_focus: 3     # Turbo

# =============================================================================
# DERIVED SENSORS
# =============================================================================
template:
  - sensor:
      - name: "Pool HP Delta T"
        unique_id: fairland_hp_delta_t
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ has_value('sensor.pool_hp_water_outlet_temperature')
             and has_value('sensor.pool_hp_water_inlet_temperature') }}
        state: >
          {{ (states('sensor.pool_hp_water_outlet_temperature') | float
              - states('sensor.pool_hp_water_inlet_temperature') | float)
             | round(2) }}

      # Thermal output = flow (L/s) x 4.18 kJ/kg.K x deltaT.
      # Only as good as the flow figure — measure it, don't use the nameplate.
      - name: "Pool HP Thermal Output"
        unique_id: fairland_hp_thermal_output
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.pool_hp_delta_t') }}"
        state: >
          {% set flow_lpm = 300 %}
          {% set dt = states('sensor.pool_hp_delta_t') | float(0) %}
          {% if is_state('binary_sensor.pool_hp_compressor_demand', 'on') %}
            {{ ((flow_lpm / 60) * 4.18 * dt) | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "Pool HP Working Mode"
        unique_id: fairland_hp_working_mode_text
        icon: mdi:volume-medium
        availability: "{{ has_value('sensor.pool_hp_working_mode_raw') }}"
        state: >
          {% set m = states('sensor.pool_hp_working_mode_raw') | int(-1) %}
          {{ {0: 'Smart', 1: 'Silence', 3: 'Turbo'}.get(m, 'Unknown') }}

      - name: "Pool HP Operating Mode"
        unique_id: fairland_hp_function_text
        icon: mdi:sun-snowflake-variant
        availability: "{{ has_value('sensor.pool_hp_function_selection_raw') }}"
        state: >
          {% set m = states('sensor.pool_hp_function_selection_raw') | int(-1) %}
          {{ {0: 'Auto', 1: 'Heating', 2: 'Cooling'}.get(m, 'Unknown') }}

      - name: "Pool HP Water Pump Mode"
        unique_id: fairland_hp_pump_mode_text
        icon: mdi:pump
        availability: "{{ has_value('sensor.pool_hp_water_pump_mode_raw') }}"
        state: >
          {% set m = states('sensor.pool_hp_water_pump_mode_raw') | int(-1) %}
          {{ {0: 'Continuous', 1: 'Water temp control',
              2: 'Time / water temp control'}.get(m, 'Unknown') }}

      - name: "Pool HP Active Faults"
        unique_id: fairland_hp_active_faults
        icon: mdi:alert-circle-outline
        state: >
          {% set ns = namespace(faults=[]) %}
          {% for e in states.binary_sensor
             if e.entity_id.startswith('binary_sensor.pool_hp_fault_')
             and e.state == 'on' %}
            {% set ns.faults = ns.faults + [e.name | replace('Pool HP Fault ', '')] %}
          {% endfor %}
          {{ ns.faults | join(', ') if ns.faults else 'None' }}

# =============================================================================
# SCRIPTS — direct register writes
# =============================================================================
script:
  # Mode selection lives here rather than on the climate entity, which is
  # pinned to heating so its temperature bounds are always correct. HR 0
  # range is 0-2 per the doc; nothing else is writable here.
  pool_hp_set_function:
    alias: "Pool HP: set function (auto / heating / cooling)"
    fields:
      function:
        name: Function
        description: "0 = Auto, 1 = Heating, 2 = Cooling"
        required: true
        selector:
          select:
            options:
              - label: Auto
                value: "0"
              - label: Heating
                value: "1"
              - label: Cooling
                value: "2"
    sequence:
      - action: modbus.write_register
        data:
          hub: fairland_hp
          slave: 1
          address: 0
          value: "{{ function | int }}"

  pool_hp_set_working_mode:
    alias: "Pool HP: set working mode"
    fields:
      mode:
        name: Mode
        description: >-
          0 = Smart, 1 = Silence, 3 = Turbo. Do not send 2. The doc notes
          "some models without Turbo", so 3 may have no effect on this unit.
        required: true
        selector:
          select:
            options:
              - label: Smart
                value: "0"
              - label: Silence
                value: "1"
              - label: Turbo
                value: "3"
    sequence:
      - action: modbus.write_register
        data:
          hub: fairland_hp
          slave: 1
          address: 1
          value: "{{ mode | int }}"

  # Auto and cooling setpoints are script-only. The climate entity is pinned
  # to heating (HR 3) so that its single min/max pair is always correct; these
  # two carry their own documented bounds, which differ from heating's.
  pool_hp_set_auto_setpoint:
    alias: "Pool HP: set auto-mode setpoint"
    fields:
      temperature:
        name: Temperature
        description: "12 to 40 °C, whole degrees"
        required: true
        selector:
          number:
            min: 12
            max: 40
            step: 1
            unit_of_measurement: "°C"
    sequence:
      - action: modbus.write_register
        data:
          hub: fairland_hp
          slave: 1
          address: 2
          value: "{{ ((temperature | float * 2) + 60) | round(0) | int }}"

  pool_hp_set_cooling_setpoint:
    alias: "Pool HP: set cooling setpoint"
    fields:
      temperature:
        name: Temperature
        description: "12 to 30 °C, whole degrees"
        required: true
        selector:
          number:
            min: 12
            max: 30
            step: 1
            unit_of_measurement: "°C"
    sequence:
      - action: modbus.write_register
        data:
          hub: fairland_hp
          slave: 1
          address: 4
          value: "{{ ((temperature | float * 2) + 60) | round(0) | int }}"

  pool_hp_set_water_pump_mode:
    alias: "Pool HP: set water pump mode"
    fields:
      mode:
        name: Mode
        description: "0 = continuous, 1 = water temp control, 2 = time + water temp"
        required: true
        selector:
          number:
            min: 0
            max: 2
            mode: box
    sequence:
      - action: modbus.write_register
        data:
          hub: fairland_hp
          slave: 1
          address: 5
          value: "{{ mode | int }}"
