        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P6"
        unique_id: fairland_hp_di_70_p6
        device_address: 1
        address: 70
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P7"
        unique_id: fairland_hp_di_71_p7
        device_address: 1
        address: 71
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P8"
        unique_id: fairland_hp_di_72_p8
        device_address: 1
        address: 72
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P9"
        unique_id: fairland_hp_di_73_p9
        device_address: 1
        address: 73
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault PA"
        unique_id: fairland_hp_di_74_pa
        device_address: 1
        address: 74
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault F0"
        unique_id: fairland_hp_di_80_f0
        device_address: 1
        address: 80
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault F1"
        unique_id: fairland_hp_di_81_f1
        device_address: 1
