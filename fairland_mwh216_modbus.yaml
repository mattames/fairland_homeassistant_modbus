# =============================================================================
# Fairland MWH216 control board — Home Assistant Modbus package
# AES-rebadged pool heat pump, via Protoss PW11 gateway
# =============================================================================
#
# Register map source: Fairland "Modbus Wärmepumpe MWH216 & MWH298" protocol
# document. This is the map for THIS board, not a sibling. Anything that
# appears in maps for MWH366/367/381 and not here has been left out.
#
# LINK SETTINGS (from the doc):
#   RS485, Modbus RTU, 9600, 1 start + 8 data + 1 stop, no parity
#   Slave address fixed at 1 (MWH216 has no slave-number register)
#   At least 60 ms between transactions
#
# TWO TEMPERATURE ENCODINGS — this board uses both. Getting them mixed up
# gives readings that look plausible but are 30 °C out.
#
#   Type 1:  °C = (raw - 60) / 2     ->  scale: 0.5, offset: -30
#            Used by: water inlet/outlet, ambient, outer coil, gas return,
#            inner coil, all setpoints, defrost temps, EEV superheat.
#
#   Type 2:  °C = raw / 2            ->  scale: 0.5, NO offset
#            Used by: gas exhaust temp (IR 6) and cooling plate temp (IR 12)
#            ONLY. These run hot (60-100 °C), which is why they need the
#            wider unsigned range.
#
# READ-LENGTH CONSTRAINT — important, and stricter on this board than on the
# MWH366/367/381 family. The doc states reads must begin at a permitted first
# address, with the count fixed at 48 bits for 0x/1x and 3 registers for
# 3x/4x, "otherwise the slave may return incorrect data".
#   Permitted first addresses:  1x -> 0, 48
#                               4x -> 0, 3, 6, 9, 12, 15, 18
#                               3x -> 0, 3, 6, 9, 12
# This config uses single-register reads, as every working community Fairland
# config does. If you see values that are stable but wrong, or that look like
# a neighbouring register, that constraint is being enforced on your firmware
# — see the BLOCK READ FALLBACK note near the fault sensors.
#
# DO NOT WRITE COIL 2. It is "Restore factory values" on this board.
#
# INSTALL
#   1. Save as <config>/packages/fairland_mwh216_modbus.yaml
#   2. configuration.yaml:
#          homeassistant:
#            packages: !include_dir_named packages
#   3. Set the PW11's IP and port below.
#   4. Developer Tools > YAML > Check configuration, then restart.
#
# FIRST-RUN VERIFICATION (there are no version/model registers on this board,
# so this is how you confirm the map):
#   a) sensor.pool_hp_heating_setpoint must match the unit's own display.
#   b) sensor.pool_hp_water_inlet_temperature must be a plausible pool temp.
#   c) sensor.pool_hp_gas_exhaust_temperature should read far higher than the
#      water temps when running (typically 60-100 °C). If it reads about 30 °C
#      below where it should, the type-2 encoding is wrong for your firmware.
#   Do not write anything until (a) is confirmed.
# =============================================================================

modbus:
  - name: fairland_hp
    # Protoss PW11 with Modbus TCP <-> RTU conversion enabled.
    # The gateway parses each request, adds the CRC and handles RTU framing,
    # and serialises requests from multiple clients onto the one RS485 bus —
    # which is what lets HA poll while you run a pymodbus scan.
    type: tcp
    host: 192.168.1.200        # <-- CHANGE ME
    port: 502                  # <-- VERIFY. 502 is standard for Modbus TCP,
                               #     but the PW11 may keep its socket port.
    delay: 5
    timeout: 10                # generous: this is WiFi
    message_wait_milliseconds: 60

    # --- If you revert the PW11 to transparent TCP Server mode ---------------
    # type: rtuovertcp
    # host: 192.168.1.200
    # port: 8899
    #
    # Either way: disable the PW11's heartbeat and registration packets, and
    # leave its own Modbus Master polling off.

    # =========================================================================
    # DISCRETE INPUTS (1x) — read-only, FC02
    # =========================================================================
    # NOTE: on MWH216 the I/O bits are generic — the doc names them DIN1-5 and
    # OUT1-9 with no indication of what each is wired to. (The named versions
    # you'll find in other Fairland configs come from different boards.) To
    # identify them, watch the states while the unit cycles: one OUT will
    # follow the compressor, one the fan, one the 4-way valve during defrost.
    # Rename them once you know.
    binary_sensors:
      - name: "Pool HP Running"
        unique_id: fairland_hp_di_00_onoff
        device_address: 1
        address: 0
        input_type: discrete_input
        device_class: running
        scan_interval: 10

      - name: "Pool HP Defrosting"
        unique_id: fairland_hp_di_01_defrosting
        device_address: 1
        address: 1
        input_type: discrete_input
        scan_interval: 15

      - name: "Pool HP DIN1"
        unique_id: fairland_hp_di_02_din1
        device_address: 1
        address: 2
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP DIN2"
        unique_id: fairland_hp_di_03_din2
        device_address: 1
        address: 3
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP DIN3"
        unique_id: fairland_hp_di_04_din3
        device_address: 1
        address: 4
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP DIN4"
        unique_id: fairland_hp_di_05_din4
        device_address: 1
        address: 5
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP DIN5"
        unique_id: fairland_hp_di_06_din5
        device_address: 1
        address: 6
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP OUT1"
        unique_id: fairland_hp_di_07_out1
        device_address: 1
        address: 7
        input_type: discrete_input
        scan_interval: 15

      - name: "Pool HP OUT2"
        unique_id: fairland_hp_di_08_out2
        device_address: 1
        address: 8
        input_type: discrete_input
        scan_interval: 15

      - name: "Pool HP OUT3"
        unique_id: fairland_hp_di_09_out3
        device_address: 1
        address: 9
        input_type: discrete_input
        scan_interval: 15

      - name: "Pool HP OUT4"
        unique_id: fairland_hp_di_10_out4
        device_address: 1
        address: 10
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP OUT5"
        unique_id: fairland_hp_di_11_out5
        device_address: 1
        address: 11
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP OUT6"
        unique_id: fairland_hp_di_12_out6
        device_address: 1
        address: 12
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP OUT7"
        unique_id: fairland_hp_di_13_out7
        device_address: 1
        address: 13
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP OUT8"
        unique_id: fairland_hp_di_14_out8
        device_address: 1
        address: 14
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP OUT9"
        unique_id: fairland_hp_di_15_out9
        device_address: 1
        address: 15
        input_type: discrete_input
        scan_interval: 30

      - name: "Pool HP Malfunction Indicator"
        unique_id: fairland_hp_di_16_malfunction
        device_address: 1
        address: 16
        input_type: discrete_input
        device_class: problem
        scan_interval: 15

      - name: "Pool HP Compressor Demand"
        unique_id: fairland_hp_di_17_comp_demand
        device_address: 1
        address: 17
        input_type: discrete_input
        scan_interval: 15

      # --- Fault flags --------------------------------------------------
      # MWH216 layout: E0-E9 (48-57), EA (58), Eb (59), 60 reserved, Ed (61),
      # 62-63 reserved, P0-P9 (64-73), PA (74), 75-79 reserved,
      # F0-F9 (80-89), FA (90), Fb (91), 92-95 reserved.
      # Reserved addresses are deliberately not read.
      #
      # BLOCK READ FALLBACK: if single-bit reads return bad data, the doc's
      # prescribed read is 48 bits starting at address 48, which covers this
      # entire range in one request. Replace every entry below with:
      #   - name: "Pool HP Fault Bits"
      #     unique_id: fairland_hp_di_48_block
      #     device_address: 1
      #     address: 48
      #     input_type: discrete_input
      #     virtual_count: 47
      #     scan_interval: 30
      # That yields "Pool HP Fault Bits" plus _1.._47, in address order from
      # 48, so _3 is E3, _16 is P0, _32 is F0.
      - name: "Pool HP Fault E0"
        unique_id: fairland_hp_di_48_e0
        device_address: 1
        address: 48
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E1"
        unique_id: fairland_hp_di_49_e1
        device_address: 1
        address: 49
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E2"
        unique_id: fairland_hp_di_50_e2
        device_address: 1
        address: 50
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E3"
        unique_id: fairland_hp_di_51_e3
        device_address: 1
        address: 51
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E4"
        unique_id: fairland_hp_di_52_e4
        device_address: 1
        address: 52
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E5"
        unique_id: fairland_hp_di_53_e5
        device_address: 1
        address: 53
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E6"
        unique_id: fairland_hp_di_54_e6
        device_address: 1
        address: 54
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E7"
        unique_id: fairland_hp_di_55_e7
        device_address: 1
        address: 55
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E8"
        unique_id: fairland_hp_di_56_e8
        device_address: 1
        address: 56
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault E9"
        unique_id: fairland_hp_di_57_e9
        device_address: 1
        address: 57
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault EA"
        unique_id: fairland_hp_di_58_ea
        device_address: 1
        address: 58
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault Eb"
        unique_id: fairland_hp_di_59_eb
        device_address: 1
        address: 59
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault Ed"
        unique_id: fairland_hp_di_61_ed
        device_address: 1
