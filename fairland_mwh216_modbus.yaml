        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P0"
        unique_id: fairland_hp_di_64_p0
        device_address: 1
        address: 64
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P1"
        unique_id: fairland_hp_di_65_p1
        device_address: 1
        address: 65
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P2"
        unique_id: fairland_hp_di_66_p2
        device_address: 1
        address: 66
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P3"
        unique_id: fairland_hp_di_67_p3
        device_address: 1
        address: 67
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P4"
        unique_id: fairland_hp_di_68_p4
        device_address: 1
        address: 68
        input_type: discrete_input
        device_class: problem
        scan_interval: 30

      - name: "Pool HP Fault P5"
        unique_id: fairland_hp_di_69_p5
        device_address: 1
