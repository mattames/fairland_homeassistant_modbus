# configuration.yaml
modbus:
  - type: tcp
    host: 192.168.0.xx
    port: 502
    name: "Protoss"
    climates:
      - name: "Meranus"
        slave: 1
        address: 3
        input_type: input
        data_type: int16
        max_temp: 40
        min_temp: 18
        offset: -30
        precision: 1
        scale: 0.5
        target_temp_register: 3
        temp_step: 1
        temperature_unit: C
        hvac_mode_register:
          address: 1
          write_registers: false
          values:
            state_auto: 1
            state_heat: 0
        hvac_onoff_register: 0
        write_registers: false
    switches:
      - name: ME6_Power
        unique_id: ME6_Power
        slave: 1
        address: 0
        command_on: 1
        command_off: 0
        write_type: coil
        verify:
            input_type: coil
            address: 0
            delay: 1
            state_on: 1
            state_off: 0
