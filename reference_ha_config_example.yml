        turn_off:
          service: modbus.write_register
          data:
            hub: Protoss
            slave: 1
            address: 1
            value: 0



I have now removed the climate-part of the modbus-integration and bundled the control of the heat pump completely in one device with the HACS Template Climate 20. For this I had to create three scripts to control temperature, silent mode and main switch. Now I’m happy with the integration so far.

If anyone is interested here’s the code:


#configuration.yaml

climate:
  - platform: climate_template
    name: Poolwärmepumpe
    unique_id: meranus_poolheizung
    modes:
      - "off"
      - "heat"
    fan_modes:
      - "low"
      - "high"
    min_temp: 18
    max_temp: 40
    # get current temp.
    current_temperature_template: "{{ states('sensor.me6_water_inlet_temp') }}"
    target_temperature_template: "{{ states('sensor.me6_settemp_heat') }}"
    fan_mode_template: "{% if is_state('sensor.me6_silence', '1') -%} low {%- else -%} high {%- endif %}"
    hvac_mode_template: "{% if is_state('switch.me6_power', 'on') -%} heat {%- else -%} off {%- endif %}"
    precision: 0.1
    temp_step: 1
    # fan_mode action (silence)
    set_fan_mode:
      # send the silentmode state to modbus-device
      - service: script.meranus_set_silent
        data:
          silent: "{{ fan_mode }}"
    set_hvac_mode:
      # send the silentmode state to modbus-device
      - service: script.meranus_set_power
        data:
          power: "{{ hvac_mode }}"
    set_temperature:
      # send the silentmode state to modbus-device
      - service: script.meranus_set_temp
        data:
          temp: "{{ temperature }}"

#Scripts:-

alias: meranus_set_power
sequence:
  - variables:
      val_power: >-
        {% if power == 'heat' -%} {{(1 | int)}} {%- else -%} {{(0 | int)}} {%-
        endif %}
  - condition: template
    value_template: >-
      {{ False if bool(states("switch.me6_power")) == bool(val_power) else True
      }}
  - service: modbus.write_coil
    data:
      hub: Protoss
      address: 0
      slave: 1
      state: "{{ val_power }}"
mode: single

alias: meranus_set_silent
sequence:
  - variables:
      val_silence: >-
        {% if silent == 'low' -%} {{(1 | int)}} {%- else -%} {{(0 | int)}} {%-
        endif %}
  - condition: not
    conditions:
      - condition: template
        value_template: "{{ is_state(\"sensor.me6_silence\", val_silence | string) }}"
  - service: modbus.write_register
    data:
      hub: Protoss
      slave: 1
      address: 1
      value: "{{ val_silence }}"
mode: single

alias: meranus_set_temp
sequence:
  - condition: not
    conditions:
      - condition: template
        value_template: "{{ is_state(\"sensor.me6_settemp_heat\", temp | int | string) }}"
  - service: modbus.write_register
    data:
      hub: Protoss
      address: 3
      slave: 1
      value: "{{ ((temp + 30) * 2 ) | int }}"
mode: single
